<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Playlisterr">
  <title>Playlisterr</title>
  <defs>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc25c"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Heavier than the logo mark on purpose: at 16px a hairline stroke and a
       thin chevron both disappear, so the tab icon is a solid tile with two
       chunky shapes rather than a shrunken copy of the full logo. -->
  <rect width="64" height="64" rx="14" fill="#1e2128"/>
  <!-- Same centring correction as the logo, scaled up: the 8px stroke's
       round cap paints 4px past the chevron tip, so the ink runs 10..54 and
       is centred on 32. -->
  <path d="M10 16 L10 48 L32 32 Z" fill="url(#fx)"/>
  <path d="M38 18 L50 32 L38 46" fill="none" stroke="url(#fx)"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
